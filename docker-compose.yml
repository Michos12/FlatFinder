# Mongo for local development. The API and the frontend are started with
# `npm run dev:api` and `npm run dev:web`, which reload on save.
services:
  mongo:
    image: mongo:7
    container_name: flatfinder-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
