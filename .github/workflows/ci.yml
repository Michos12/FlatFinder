name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tipos, tests y build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Los tests levantan una MongoDB en memoria; sin cache, cada ejecucion
      # se descarga el binario de mongod otra vez.
      - name: Cachear el binario de mongod
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Tests del API
        run: npm test

      - name: Build de produccion
        run: npm run build
