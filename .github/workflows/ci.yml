name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, tests and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The tests spin up an in-memory MongoDB; without a cache, every run
      # downloads the mongod binary again.
      - name: Cache the mongod binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: API tests
        run: npm run test:api

      - name: Frontend tests
        run: npm run test:web

      - name: Production build
        run: npm run build
