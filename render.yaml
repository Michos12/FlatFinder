# Render blueprint for the API. The database lives separately on MongoDB
# Atlas: MONGO_URL is filled in by hand from the dashboard.
services:
  - type: web
    name: flatfinder-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGO_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 2h
      # The frontend is served from Vercel and reaches the API through a
      # same-origin rewrite, so CORS is only needed for local development.
      - key: CORS_ORIGIN
        value: http://localhost:4200
