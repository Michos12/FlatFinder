<div class="auth">
  <form class="auth__card" [formGroup]="form" (ngSubmit)="onSubmit()">
    <h1 class="auth__title">Entrar en FlatFinder</h1>

    @if (errorMessage()) {
      <p class="alert alert--error">{{ errorMessage() }}</p>
    }

    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="field__error">Introduce un email valido</span>
      }
    </div>

    <div class="field">
      <label for="password">Contrasena</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field__error">La contrasena es obligatoria</span>
      }
    </div>

    <button type="submit" class="btn btn--primary auth__submit" [disabled]="submitting()">
      {{ submitting() ? 'Entrando...' : 'Entrar' }}
    </button>

    <p class="auth__footer">
      No tienes cuenta? <a routerLink="/register">Crear una</a>
    </p>
  </form>
</div>
