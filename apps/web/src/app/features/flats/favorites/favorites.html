<section class="page">
  <h1 class="page__title">My favourites</h1>
  <p class="page__subtitle">The flats you saved to come back to.</p>

  @if (errorMessage()) {
    <p class="alert alert--error">{{ errorMessage() }}</p>
  }

  @if (loading()) {
    <p class="empty-state">Loading favourites…</p>
  } @else if (flats().length === 0) {
    <p class="empty-state">
      You haven't saved any flats yet. <a routerLink="/">Browse the listings</a>.
    </p>
  } @else {
    <div class="grid">
      @for (flat of flats(); track flat.id) {
        <app-flat-card [flat]="flat">
          <a class="btn" [routerLink]="['/flats', flat.id]">View details</a>
          <button type="button" class="btn btn--danger" (click)="remove(flat)">
            Remove from favourites
          </button>
        </app-flat-card>
      }
    </div>
  }
</section>
